name: Build Dylib

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install dpkg ldid ninja

      - name: Setup Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          # Tải SDK iOS chính thức cho Theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/* $HOME/theos/sdks/
          rm -rf sdks-master master.zip

      - name: Build Tweak
        run: |
          export THEOS=$HOME/theos
          $THEOS/bin/make clean
          $THEOS/bin/make FINALPACKAGE=1

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Dylib
          path: |
            .theos/obj/*.dylib
            .theos/obj/debug/*.dylib
            packages/*.deb
